databases:
  - name: civiclens-db
    databaseName: civiclens
    user: civiclens
    plan: free
    region: oregon

services:
  - type: web
    name: civiclens-ai
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: civiclens-ai.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://civiclens-ai.onrender.com
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_SECURE_COOKIES
        value: "True"
      - key: DJANGO_DB_ENGINE
        value: postgresql
      - key: DATABASE_URL
        fromDatabase:
          name: civiclens-db
          property: internalConnectionString
